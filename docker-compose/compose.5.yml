# LEVEL 5 - NETWORKS AND PROFILES
#
# Right now every service is on one network, and everybody can talk to everybody. Better:
#   - the database must be reachable ONLY by the web app. Not from your computer, not from other services.
#   - an admin tool (Adminer, a web page to look inside the database) is useful, but it must start ONLY when you ask.
#
# Start from your compose.4.yml (copy it here). Then:
#
# TODO 1: two networks, declared at the top level:
#
#   networks:
#     frontend:
#     backend:
#
#   - web is on BOTH:         networks: [frontend, backend]
#   - db is only on backend:  networks: [backend]
#
# TODO 2: db must not publish a port. Make sure it has no "ports:" at all. (web talks to it through the network.)
#
# TODO 3: a third service, adminer. It starts only with the profile "tools":
#
#   adminer:
#     image: adminer
#     profiles: ["tools"]
#     ports:
#       - "8091:8080"
#     networks: [backend]
#
# Start it with:   docker compose -f compose.5.yml --profile tools up -d
# Then open http://localhost:8091   (System: PostgreSQL, Server: db, user and password from .env)
#
# The checker: db is only on the backend network and has no port, web is on both, adminer is NOT started
# by a normal "up", and it IS started (and answers on 8091) with --profile tools.

networks:
  frontend:
  backend:

services:
  web:
    build: ./app                  # the folder that has the Dockerfile of the web app (it is in ./app)
    ports:
      - "${WEB_PORT}:8080"                   # host port 8090 -> container port 8080   (written "8090:8080")
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}   # the HOST NAME of the database = the NAME of the db service below!
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend, frontend]
  db:
    image: postgres:16-alpine                  # the PostgreSQL image:  postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [backend]
  adminer:
    image: adminer
    profiles: ["tools"]
    ports:
      - "8091:8080"
    networks: [backend]

volumes:
  dbdata:

